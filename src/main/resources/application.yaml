spring:
  application:
    name: hub-server

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5433/hub_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false